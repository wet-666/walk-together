services:
  mysql:
    image: mysql:8.4
    container_name: walk-together-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-walktogether}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-walk_together}
      MYSQL_USER: ${MYSQL_USER:-walk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-walktogether}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=32
      - --table-open-cache=64
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    mem_limit: 400m
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwalk", "-pwalktogether"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: walk-together-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prebuilt
    container_name: walk-together-api
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    mem_limit: 256m
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: walk-together-nginx
    mem_limit: 32m
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.h5.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/mobile/dist/build/h5:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  api_uploads:
