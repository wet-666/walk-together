services:
  mysql:
    image: mysql:8.4
    container_name: walk-together-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: walktogether
      MYSQL_DATABASE: walk_together
      MYSQL_USER: walk
      MYSQL_PASSWORD: walktogether
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwalk", "-pwalktogether"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: walk-together-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
